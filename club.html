<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hariyali Club</title>
  <link rel="stylesheet" href="style1.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter&display=swap" rel="stylesheet">
</head>
<body>
  <section class="club-container">
    <div class="content">
      <h1 class="title">Hariyali Club</h1>
      <p class="subtitle">An exclusive Ayurvedic experience—invite-only or opt-in membership</p>
      
      <ul class="perks">
        <li>🌿 Early Access to New Products</li>
        <li>🌿 Exclusive Drops for Members</li>
        <li>🌿 Live Q&A with Ayurvedic Experts</li>
      </ul>

      <form class="signup-form">
        <h2>Join the Waitlist</h2>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Email Address" required />
        <button type="submit">Request Invite</button>
        <p class="freebie">🎁 Get a free <strong>Digital Wellness Checklist (PDF)</strong> upon joining!</p>
      </form>
    </div>
  </section>
</body>
</html>
