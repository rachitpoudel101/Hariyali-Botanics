{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  .digital-guide-section {
    font-family: 'Open Sans', sans-serif;
  }
</style>
<section class="w-full bg-white py-12 px-4 digital-guide-section">
  <div class="max-w-6xl mx-auto">
    <h2 class=" md:text-3xl font-medium text-[#18382c] mb-8 text-center">Digital Guides</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      {% for guide in guides %}
      <div class="bg-[#f8f5f0] overflow-hidden hover:shadow-lg transition-all duration-300">
        {% if guide.image %}
          <img src="{{ guide.image.url }}" alt="{{ guide.title }}" class="w-full h-48 object-cover">
        {% endif %}
        <div class="p-5">
          <div class="inline-block px-3 py-1 bg-[#8B4513] text-white text-xs font-medium rounded-full mb-3">Guide</div>
          <h3 class="text-lg font-bold text-[#18382c] mb-2">{{ guide.title }}</h3>
          <p class="text-gray-600 text-xs mb-4">{{ guide.description|truncatewords:20 }}</p>
          <div class="flex justify-between items-center">
            <a href="{% url 'guide-detail' guide.id %}" class="text-[#18382c] hover:text-[#8B4513] font-medium text-xs">Learn More →</a>
          </div>
        </div>
      </div>
      {% empty %}
      <p class="col-span-full text-center text-gray-500">No guides available.</p>
      {% endfor %}
    </div>
    
    <div class="flex justify-center mt-8">
      <a href="{% url 'guide' %}" class="inline-flex items-center justify-center px-5 py-2.5 border border-[#18382c] text-[#18382c] font-semibold rounded-lg hover:bg-[#18382c] hover:text-white transition-all duration-300 text-sm">
        View All Digital Guides
        <i class="fas fa-arrow-right ml-2"></i>
      </a>
    </div>
  </div>
</section>
