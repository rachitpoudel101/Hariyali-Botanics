<!-- ======= COMMUNITY TESTIMONIALS SECTION ======= -->
  <section class="w-full bg-[#fdfaf6] py-10 px-2 sm:py-16 sm:px-4 flex flex-col items-center">
    <h3 class="text-xl md:text-2xl font-bold text-[#18382c] mb-8">Hariyali Community <span class="text-[#8B4513]">|</span> Love Notes</h3>
    <div class="w-full max-w-md sm:max-w-2xl relative">
      <div id="testimonial-rotator" class="text-center">
        <blockquote class="text-lg md:text-xl italic text-[#18382c] font-playfair min-h-[100px]" id="testimonial-quote">
          "The products have transformed my skin! Love the natural feel."
        </blockquote>
      </div>
    </div>
    
    <!-- Love Notes Gallery -->
    <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto">
      {% for review in reviews %}
        <div class="bg-white p-4 rounded-lg shadow">
          <div class="flex items-center mb-3">
            <div class="w-10 h-10 rounded-full bg-[#f8f5f0] flex items-center justify-center text-[#8B4513] font-bold">
              {{ review.name|slice:":1" }}
            </div>
            <div class="ml-3">
              <div class="font-semibold">{{ review.name }}</div>
              <div class="text-xs text-gray-500">{{ review.location }}</div>
            </div>
          </div>
          <p class="text-sm text-gray-700">"{{ review.testimonial }}"</p>
        </div>
      {% empty %}
        <p class="col-span-full text-center text-gray-500">No reviews available.</p>
      {% endfor %}
    </div>
  </section>
