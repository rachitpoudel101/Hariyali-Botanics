<!-- ======= COMMUNITY TESTIMONIALS SECTION ======= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">


  <section class="w-full bg-[#fdfaf6] py-10 px-2 sm:py-16 sm:px-4 flex flex-col items-center">
    <h2 class="text-2xl text-center font-sans font-bold text-[#18382c] mb-8">Hariyali Community <span class="text-[#8B4513]">|</span> Love Notes</h2>
    <div class="w-full max-w-md sm:max-w-2xl relative">
      <div id="testimonial-rotator" class="text-center overflow-hidden">
        <div id="testimonial-container" class="flex transition-transform duration-500 ease-in-out">
          {% for review in reviews %}
          <div class="testimonial-slide w-full flex-shrink-0">
            <blockquote class="text-lg md:text-xl italic text-[#18382c] font-sans min-h-[100px]">
              "{{ review.testimonial }}"
            </blockquote>
            <div class="mt-4 text-center">
                <p class="font-semibold text-[#18382c]">{{ review.name }}</p>
                <p class="text-sm text-gray-500">{{ review.location }}</p>
            </div>
          </div>
          {% empty %}
          <blockquote class="text-lg md:text-xl italic text-[#18382c] font-sans min-h-[100px]">
            No love notes yet.
          </blockquote>
          {% endfor %}
        </div>
      </div>
    </div>
  </section>

  <style>
  .swiper-button-prev:after,
  .swiper-rtl .swiper-button-next:after {
      content: '' !important;
  }
  .swiper-button-next:after,
  .swiper-rtl .swiper-button-prev:after {
      content: '' !important;
  }
  .swiper-button-next svg,
  .swiper-button-prev svg {
      width: 24px !important;
      height: 24px !important;
  }
  .swiper-button-next,
  .swiper-button-prev {
      position: relative !important;
  }
  .swiper-slide.swiper-slide-active {
      --tw-border-opacity: 1 !important;
      border-color: rgb(79 70 229 / var(--tw-border-opacity)) !important;
  }
  .swiper-slide.swiper-slide-active>.swiper-slide-active\:text-indigo-600 {
      --tw-text-opacity: 1;
      color: rgb(79 70 229 / var(--tw-text-opacity));
  }
  .swiper-slide.swiper-slide-active>.flex .grid .swiper-slide-active\:text-indigo-600 {
      --tw-text-opacity: 1;
      color: rgb(79 70 229 / var(--tw-text-opacity));
  }
  /* scrollbar hide and viewport tweaks (like product slider) */
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .slider-viewport { align-items: flex-start; }

  /* Added: make testimonial slider snap on mobile and ensure full-width cards */
  .slider-viewport { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  #testimonial-slider { scroll-padding-left: 1rem; }
  .testimonial-card { scroll-snap-align: start; }

  /* Position arrows further outside the content on medium+ screens */
  @media (min-width: 768px) {
    .testimonials-arrow-left { left: -48px; }   /* push left arrow further left */
    .testimonials-arrow-right { right: -48px; } /* push right arrow further right */
  }
  </style>

  <script>
    (function() {
      const container = document.getElementById('testimonial-container');
      if (!container || container.children.length <= 1) return;

      const slides = container.children;
      let currentIndex = 0;

      function showSlide(index) {
        container.style.transform = `translateX(-${index * 100}%)`;
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
      }

      setInterval(nextSlide, 5000); // Change slide every 5 seconds
    })();
  </script>
