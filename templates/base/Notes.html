<!-- ======= COMMUNITY TESTIMONIALS SECTION ======= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">


  <section class="w-full bg-[#fdfaf6] py-10 px-2 sm:py-16 sm:px-4 flex flex-col items-center">
    <h2 class="text-2xl text-center font-sans font-bold text-[#18382c] mb-8">Hariyali Community <span class="text-[#8B4513]">|</span> Love Notes</h2>
    <div class="w-full max-w-md sm:max-w-2xl relative">
      <div id="testimonial-rotator" class="text-center">
        <blockquote class="text-lg md:text-xl italic text-[#18382c] font-sans min-h-[100px]" id="testimonial-quote">
          "The products have transformed my skin! Love the natural feel."
        </blockquote>
      </div>
    </div>
  </section>

  <style>
  .swiper-button-prev:after,
  .swiper-rtl .swiper-button-next:after {
      content: '' !important;
  }
  .swiper-button-next:after,
  .swiper-rtl .swiper-button-prev:after {
      content: '' !important;
  }
  .swiper-button-next svg,
  .swiper-button-prev svg {
      width: 24px !important;
      height: 24px !important;
  }
  .swiper-button-next,
  .swiper-button-prev {
      position: relative !important;
  }
  .swiper-slide.swiper-slide-active {
      --tw-border-opacity: 1 !important;
      border-color: rgb(79 70 229 / var(--tw-border-opacity)) !important;
  }
  .swiper-slide.swiper-slide-active>.swiper-slide-active\:text-indigo-600 {
      --tw-text-opacity: 1;
      color: rgb(79 70 229 / var(--tw-text-opacity));
  }
  .swiper-slide.swiper-slide-active>.flex .grid .swiper-slide-active\:text-indigo-600 {
      --tw-text-opacity: 1;
      color: rgb(79 70 229 / var(--tw-text-opacity));
  }
  </style>

  <section class="py-24 font-sans">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="mb-14 flex flex-col justify-center items-center sm:flex-row sm:items-center sm:justify-between max-sm:gap-8">
              <h2 class="text-2xl text-center font-sans font-bold text-gray-900 lg:text-left">Testimonials</h2>
              <!-- Slider controls -->
              <div class="flex items-center gap-8">
                  <button id="slider-button-left"
                      class="swiper-button-prev group flex justify-center items-center border border-solid border-indigo-600 w-12 h-12 transition-all duration-500 rounded-full hover:bg-indigo-600 "
                      data-carousel-prev>
                      <svg class="h-6 w-6 text-indigo-600 group-hover:text-white" viewBox="0 0 24 24" fill="none"
                          xmlns="http://www.w3.org/2000/svg">
                          <path
                              d="M20.9999 12L4.99992 12M9.99992 6L4.70703 11.2929C4.3737 11.6262 4.20703 11.7929 4.20703 12C4.20703 12.2071 4.3737 12.3738 4.70703 12.7071L9.99992 18"
                              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                  </button>
                  <button id="slider-button-right"
                      class="swiper-button-next group flex justify-center items-center border border-solid border-indigo-600 w-12 h-12 transition-all duration-500 rounded-full hover:bg-indigo-600"
                      data-carousel-next>
                      <svg class="h-6 w-6 text-indigo-600 group-hover:text-white" viewBox="0 0 24 24" fill="none"
                          xmlns="http://www.w3.org/2000/svg">
                          <path
                              d="M3 12L19 12M14 18L19.2929 12.7071C19.6262 12.3738 19.7929 12.2071 19.7929 12C19.7929 11.7929 19.6262 11.6262 19.2929 11.2929L14 6"
                              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                  </button>
              </div>
          </div>
          <!--Slider wrapper-->
          <div class="lg:flex grid grid-cols-1 md:grid-cols-2 justify-center items-center gap-8 swiper mySwiper">
              <div class="swiper-wrapper">
                  {% for review in reviews %}
                  <div class="swiper-slide group bg-white border border-solid h-auto border-gray-300 rounded-none p-6 transition-all duration-500 w-full hover:border-indigo-600 slide-active:border-indigo-600">
                      <div class="flex items-center mb-9 gap-2 text-amber-500 transition-all duration-500 group-hover:text-indigo-600 swiper-slide-active:text-indigo-600">
                          <!-- You can add stars or icons here if needed -->
                      </div>
                      <p class="text-lg text-gray-500 leading-8 h-24 transition-all duration-500 mb-9 group-hover:text-gray-800">
                          "{{ review.testimonial }}"
                      </p>
                      <div class="flex items-center gap-5">
                          <!-- Avatar or initials -->
                          <div class="w-12 h-12 rounded-full bg-[#f8f5f0] flex items-center justify-center text-[#8B4513] font-bold text-xl">
                              {{ review.name|slice:":1" }}
                          </div>
                          <div class="grid gap-1">
                              <h5 class="text-gray-900 font-medium transition-all duration-500 group-hover:text-indigo-600 swiper-slide-active:text-indigo-600">
                                  {{ review.name }}
                              </h5>
                              <span class="text-sm leading-6 text-gray-500">{{ review.location }}</span>
                          </div>
                      </div>
                  </div>
                  {% empty %}
                  <div class="swiper-slide">
                      <p class="col-span-full text-center text-gray-500">No reviews available.</p>
                  </div>
                  {% endfor %}
              </div>
          </div>
      </div>
  </section>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  <script>
      var swiper = new Swiper(".mySwiper", {
          slidesPerView: 3,
          spaceBetween: 28,
          centeredSlides: true,
          loop: true,
          pagination: {
              el: ".swiper-pagination",
              clickable: true,
          },
          navigation: {
              nextEl: ".swiper-button-next",
              prevEl: ".swiper-button-prev",
          },
          autoplay: {
              delay: 5000,
              disableOnInteraction: false,
          },
          breakpoints: {
              0: {
                  slidesPerView: 1,
                  spaceBetween: 20,
                  centeredSlides: false,
              },
              768: {
                  slidesPerView: 2,
                  spaceBetween: 28,
                  centeredSlides: true,
              },
              1024: {
                  slidesPerView: 3,
                  spaceBetween: 32,
              },
          },
      });
  </script>
