{% load static %}
<section>
  <div class="quiz-container min-h-screen flex flex-col items-center justify-center py-16 px-4 bg-gradient-to-br from-[#fdfaf6] to-[#e6e6e6]">
    <div class="w-full max-w-lg bg-white/90 rounded-2xl shadow-xl p-8 flex flex-col items-center">
      <h1 class="text-3xl font-bold text-[#18382c] mb-2 text-center">{{ quiz.title }}</h1>
      <div id="quiz-progress" class="w-full bg-gray-200 rounded-full h-2 mb-8">
        <div id="progressBar" class="bg-[#18382c] h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <div id="quiz-questions"></div>
      <div id="quiz-result" class="hidden"></div>
    </div>
  </div>
  <script src="{% static 'js/quiz-dynamic.js' %}"></script>
</section>
